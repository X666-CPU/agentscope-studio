name: Build and Download AgentScope Studio Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: false
        default: 'latest'

jobs:
  build-and-download:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 提取镜像标签（保留原有逻辑）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: build-image
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # 构建 Docker 镜像（不推送，本地构建）
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false  # 关键：关闭推送
          load: true   # 关键：加载到本地 Docker
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # 导出镜像为 tar 文件
      - name: Export Docker image to file
        run: |
          # 获取第一个标签作为镜像名称
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          # 保存镜像
          docker save -o agentscope-studio-image.tar "$IMAGE_TAG"
          
          # 压缩镜像（减小体积）
          gzip agentscope-studio-image.tar
          echo "镜像已导出并压缩：agentscope-studio-image.tar.gz"

      # 上传为构建产物，支持直接下载
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentscope-studio-docker-image
          path: agentscope-studio-image.tar.gz
          if-no-files-found: error
